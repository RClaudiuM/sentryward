name: Release image

# Publishes the production image (docker/Dockerfile) to GHCR for each release
# tag. Pre-release tags (v0.1.0-alpha.3) get their version tag only; "latest"
# moves only on stable releases. A manual run from a branch publishes a
# sha-<commit> tag for testing.
#
# Once the image is pushed, the release job publishes the GitHub release from
# the tag's CHANGELOG.md section. It runs after publish so a release is never
# announced without its image, and only for tags, so branch test runs never
# create one. Unlike the image's "latest" tag, the release's Latest badge goes
# only to the highest stable tag, so a backport (v0.4.1 after v0.5.0) never
# takes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # The image's "latest" moves on every stable tag, backports included;
          # the release job's Latest badge is stricter (highest stable tag only).
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,format=long,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Extract release notes from CHANGELOG.md
        # The version is matched literally (index, not a regex) because of the
        # dots and -alpha.N suffixes. A missing or empty section fails the job:
        # a release without notes would hide the upgrade notes.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error file=CHANGELOG.md::No changelog section for ${version}"
            exit 1
          fi
          # The compare link is a convenience, so a missing one is not an error.
          link=$(awk -v ref="[${version}]: " 'index($0, ref) == 1 { print substr($0, length(ref) + 1); exit }' CHANGELOG.md)
          if [[ -n "$link" ]]; then
            printf '\n**Full changelog**: %s\n' "$link" >> "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Publish GitHub release
        # Skips an already published release (a rerun, or one created by hand)
        # so edited notes are never overwritten. A draft fails the job instead:
        # skipping it would leave the release unpublished behind a green run.
        # Latest is set explicitly because the API marks every new stable
        # release Latest by default; only the highest stable tag gets it.
        run: |
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" == "true" ]]; then
              echo "::error::A draft release for $GITHUB_REF_NAME already exists; publish or delete it, then rerun this job."
              exit 1
            fi
            echo "Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            channel=(--prerelease --latest=false)
          else
            # Assigned on its own line so a failed API call fails the step
            # (the default shell has no pipefail).
            tags=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[].name')
            highest=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" | sort -V | tail -n 1)
            if [[ "$GITHUB_REF_NAME" == "$highest" ]]; then
              channel=(--latest)
            else
              channel=(--latest=false)
            fi
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Sentryward ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${channel[@]}"
